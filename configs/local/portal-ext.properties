#
# Database: PostgreSQL in Docker (see docker-compose.yml at the workspace root).
# Start it with `docker compose up -d` before `blade server start`.
#
jdbc.default.driverClassName=org.postgresql.Driver
jdbc.default.url=jdbc:postgresql://localhost:5432/lportal
jdbc.default.username=liferay
jdbc.default.password=liferay

#
# Admin account created on first start
#
default.admin.email.address.prefix=admin
company.default.web.id=clarityvisionsolutions.com
company.default.name=Clarity Vision Solutions
default.admin.first.name=Clarity
default.admin.last.name=Admin
default.admin.password=learn

#
# Feature flags
#
# LPD-63311  MCP server at /o/mcp (also enable it in Instance Settings, see the workbook)
# LPD-35443  Headless Admin Site API (pages, master pages, navigation)
# LPD-74328  Page element and page specification create/update (needs LPD-35443)
# LPS-164563 Data Sets admin API
#
feature.flag.LPD-63311=true
feature.flag.LPD-35443=true
feature.flag.LPD-74328=true
feature.flag.LPS-164563=true

#
# Classroom conveniences: fictional users, no email verification, no captcha
#
company.security.strangers.verify=false
terms.of.use.required=false
users.reminder.queries.enabled=false
users.reminder.queries.custom.question.enabled=false
passwords.default.policy.change.required=false
layout.user.private.layouts.enabled=false
layout.user.private.layouts.auto.create=false
layout.user.public.layouts.enabled=false
layout.user.public.layouts.auto.create=false
captcha.enforce.disabled=true
