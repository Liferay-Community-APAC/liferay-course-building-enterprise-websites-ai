liferay.workspace.bundle.dist.include.metadata=true
liferay.workspace.modules.dir=modules
liferay.workspace.themes.dir=themes
liferay.workspace.wars.dir=modules
microsoft.translator.subscription.key=
liferay.workspace.product=dxp-2026.q3.10
# The catch-up kit holds copies of the course solution: keep them out of the build,
# or their client extension IDs clash with the ones you build in client-extensions/.
liferay.workspace.dir.excludes.globs=catch-up/**
