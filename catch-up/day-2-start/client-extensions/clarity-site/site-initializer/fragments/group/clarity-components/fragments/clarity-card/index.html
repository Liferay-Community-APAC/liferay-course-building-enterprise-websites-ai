<article class="clarity-card">
	<img
		alt=""
		class="clarity-card__image"
		data-lfr-editable-id="card-image"
		data-lfr-editable-type="image"
		src=""
	/>
	<div class="clarity-card__body">
		<p class="clarity-card__category" data-lfr-editable-id="category" data-lfr-editable-type="text">
			Category
		</p>
		<h3 class="clarity-card__title" data-lfr-editable-id="card-title" data-lfr-editable-type="text">
			Card title
		</h3>
		<div class="clarity-card__summary" data-lfr-editable-id="summary" data-lfr-editable-type="rich-text">
			<p>A short summary of the article.</p>
		</div>
		<a class="clarity-card__link" data-lfr-editable-id="card-link" data-lfr-editable-type="link" href="#">
			Read more
		</a>
	</div>
</article>
